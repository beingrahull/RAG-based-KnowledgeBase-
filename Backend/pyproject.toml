[project]
name = "rag-kbeng-backend"
version = "0.1.0"
description = "RAG backend for question-answering over private PDFs"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "email-validator",
    "beanie",
    "pymongo",
    "bcrypt",
    "pyjwt",
    "pypdf",
    "langchain-text-splitters",
    "google-genai",
    "pinecone",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]